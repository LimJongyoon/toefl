<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFL Writing Practice</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1d2433;
    --muted: #5d6677;
    --line: #d5d9e0;
    --head: #20304a;
    --head-ink: #ffffff;
    --accent: #1f5fae;
    --accent-ink: #ffffff;
    --soft: #eef3fa;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 Arial, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- 공통 버튼 ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 7px 14px; border-radius: 4px; font-size: 14px;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }

  /* ---------- 설정 화면 ---------- */
  .setup { max-width: 920px; margin: 0 auto; padding: 24px 16px 60px; }
  .setup h1 { font-size: 24px; margin: 8px 0 4px; }
  .setup .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 0; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); border-bottom: none; background: #e6e9ee;
    padding: 9px 16px; border-radius: 6px 6px 0 0; font-size: 15px;
  }
  .tab.active { background: var(--panel); font-weight: bold; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 0 6px 6px 6px; padding: 20px; }
  .card + .card, .block { margin-top: 20px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
  .block h2 { font-size: 17px; margin: 0 0 12px; }
  label { display: block; font-size: 14px; font-weight: bold; margin: 14px 0 5px; }
  label .hint { font-weight: normal; color: var(--muted); }
  input[type=text], input[type=number], textarea.field {
    width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
    font: inherit; font-size: 15px; background: #fff; color: var(--ink);
  }
  textarea.field { min-height: 90px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 140px; gap: 12px; }
  @media (max-width: 640px) { .row, .row3 { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li {
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line); padding: 10px 0; flex-wrap: wrap;
  }
  .list li:first-child { border-top: none; }
  .list .meta { color: var(--muted); font-size: 13px; }
  .list .t { font-size: 15px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--soft); color: var(--accent); margin-right: 6px; font-weight: bold; }

  /* ---------- 시험 화면 ---------- */
  .exam { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .exam-head {
    background: var(--head); color: var(--head-ink);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 16px; flex-wrap: wrap;
  }
  .exam-head .title { font-weight: bold; font-size: 15px; }
  .exam-head .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exam-head .hbtn {
    background: transparent; color: var(--head-ink); border: 1px solid rgba(255,255,255,.55);
    border-radius: 4px; padding: 5px 12px; font-size: 13px;
  }
  .exam-head .hbtn:hover { background: rgba(255,255,255,.12); }
  .exam-head .hbtn.next { background: #fff; color: var(--head); font-weight: bold; border-color: #fff; }
  .timer { font-family: "Courier New", monospace; font-size: 17px; font-weight: bold; min-width: 84px; text-align: right; }
  .subhead {
    background: #e3e7ee; border-bottom: 1px solid var(--line);
    padding: 6px 16px; font-size: 13px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { overflow: auto; padding: 22px 26px; background: var(--panel); }
  .pane.left { border-right: 1px solid var(--line); }
  @media (max-width: 820px) {
    .split { grid-template-columns: 1fr; overflow: auto; }
    .pane { overflow: visible; padding: 18px 16px; }
    .pane.left { border-right: none; border-bottom: 1px solid var(--line); }
  }
  .directions { font-size: 15px; }
  .directions p { margin: 0 0 12px; }
  .directions ul { margin: 6px 0 14px; padding-left: 22px; }
  .directions li { margin: 4px 0; }
  .scenario { white-space: pre-wrap; margin: 0 0 12px; }
  .person { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; }
  .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; font-weight: bold; color: #fff; font-size: 17px;
  }
  .person .name { font-weight: bold; margin-bottom: 4px; }
  .person .text { white-space: pre-wrap; }
  .post { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: #fafbfc; margin-bottom: 14px; }
  .post .person { margin: 0; }

  .editor-wrap { display: flex; flex-direction: column; gap: 8px; }
  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .toolbar .tbtn {
    border: 1px solid var(--line); background: #f3f4f6; padding: 4px 12px; border-radius: 3px; font-size: 13px; color: var(--ink);
  }
  .toolbar .tbtn:hover { background: #e7eaef; }
  .toolbar .spacer { flex: 1; }
  .wc { font-size: 13px; color: var(--ink); }
  .wc b { font-variant-numeric: tabular-nums; }
  .email-fields { border: 1px solid var(--line); border-bottom: none; border-radius: 4px 4px 0 0; }
  .email-fields div { padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 15px; overflow-wrap: anywhere; }
  .email-fields span { color: var(--muted); display: inline-block; min-width: 64px; }
  textarea.answer {
    width: 100%; min-height: 340px; resize: vertical; border: 1px solid #9aa3b2;
    padding: 10px 12px; font: 16px/1.6 Arial, "Helvetica Neue", sans-serif; color: var(--ink); background: #fff;
  }
  .email-fields + textarea.answer { border-radius: 0 0 4px 4px; }
  textarea.answer:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea.answer[readonly] { background: #f1f2f4; color: var(--muted); }
  .resp-label { font-weight: bold; font-size: 15px; margin: 4px 0 0; }

  /* ---------- 결과 화면 ---------- */
  .result { max-width: 920px; margin: 0 auto; padding: 24px 16px 60px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; min-width: 140px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .answer-view { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; font-size: 16px; overflow-wrap: anywhere; }
  .prompt-view { white-space: pre-wrap; font-size: 14px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-wrap: anywhere; }
  details summary { cursor: pointer; font-size: 14px; color: var(--accent); margin: 14px 0 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--panel); border-radius: 6px; padding: 22px; max-width: 420px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .modal .actions { justify-content: flex-end; margin-top: 0; }
</style>
</head>
<body>

<!-- ===================== 설정 화면 ===================== -->
<div id="setup" class="setup">
  <h1>TOEFL Writing 연습</h1>
  <p class="sub">문제를 넣고 시작하면 실제 시험 화면처럼 타이머가 바로 시작됩니다. 단어 수는 실제 시험과 같이 공백 기준으로 셉니다.</p>

  <div class="tabs">
    <button class="tab active" data-tab="email">Write an Email (7분)</button>
    <button class="tab" data-tab="discussion">Academic Discussion (10분)</button>
  </div>

  <!-- 이메일 -->
  <div class="card" id="form-email">
    <label>상황 설명 <span class="hint">(시험에 나오는 시나리오 문단)</span></label>
    <textarea class="field" id="e-scenario" placeholder="You recently attended a workshop organized by your city's community center..."></textarea>

    <label>지시문 <span class="hint">(예: Write an email to Ms. Lee. In your email, do the following:)</span></label>
    <input type="text" id="e-instruction" placeholder="Write an email to the director of the community center. In your email, do the following:">

    <label>해야 할 일 3개 <span class="hint">(한 줄에 하나씩)</span></label>
    <textarea class="field" id="e-tasks" placeholder="Thank the director for organizing the workshop.&#10;Describe something you learned.&#10;Suggest a topic for a future workshop."></textarea>

    <div class="row3">
      <div><label>To</label><input type="text" id="e-to" placeholder="Ms. Lee"></div>
      <div><label>Subject</label><input type="text" id="e-subject" placeholder="Workshop feedback"></div>
      <div><label>시간(분)</label><input type="number" id="e-time" value="7" min="1" max="60" step="0.5"></div>
    </div>

    <div class="actions">
      <button class="btn primary" data-start="email">시험 시작</button>
      <button class="btn" data-save="email">문제 저장</button>
      <button class="btn" data-clear="email">비우기</button>
    </div>
  </div>

  <!-- 디스커션 -->
  <div class="card hidden" id="form-discussion">
    <div class="row">
      <div><label>수업 주제 <span class="hint">(Your professor is teaching a class on ___)</span></label><input type="text" id="d-course" placeholder="sociology"></div>
      <div><label>교수 이름</label><input type="text" id="d-prof" placeholder="Dr. Diaz"></div>
    </div>
    <label>교수 질문</label>
    <textarea class="field" id="d-question" placeholder="Over the past few decades, ..."></textarea>

    <div class="row">
      <div><label>학생 1 이름</label><input type="text" id="d-s1name" placeholder="Claire"></div>
      <div><label>학생 2 이름</label><input type="text" id="d-s2name" placeholder="Paul"></div>
    </div>
    <div class="row">
      <div><label>학생 1 의견</label><textarea class="field" id="d-s1post"></textarea></div>
      <div><label>학생 2 의견</label><textarea class="field" id="d-s2post"></textarea></div>
    </div>
    <div class="row3">
      <div></div><div></div>
      <div><label>시간(분)</label><input type="number" id="d-time" value="10" min="1" max="60" step="0.5"></div>
    </div>

    <div class="actions">
      <button class="btn primary" data-start="discussion">시험 시작</button>
      <button class="btn" data-save="discussion">문제 저장</button>
      <button class="btn" data-clear="discussion">비우기</button>
    </div>
  </div>

  <div class="block">
    <h2>저장한 문제</h2>
    <ul class="list" id="saved-list"></ul>
  </div>

  <div class="block">
    <h2>내 답안 기록</h2>
    <ul class="list" id="history-list"></ul>
  </div>
</div>

<!-- ===================== 시험 화면 ===================== -->
<div id="exam" class="exam hidden">
  <div class="exam-head">
    <div class="title">Writing</div>
    <div class="right">
      <button class="hbtn" id="toggle-time">Hide Time</button>
      <span class="timer" id="timer">00:00:00</span>
      <button class="hbtn next" id="btn-next">Next</button>
    </div>
  </div>
  <div class="subhead">
    <span id="task-name">Write an Email</span>
    <span>Question 1 of 1</span>
  </div>
  <div class="split">
    <div class="pane left" id="pane-left"></div>
    <div class="pane right">
      <div id="pane-right-top"></div>
      <div class="editor-wrap">
        <div class="toolbar">
          <button class="tbtn" data-cmd="cut">Cut</button>
          <button class="tbtn" data-cmd="paste">Paste</button>
          <button class="tbtn" data-cmd="undo">Undo</button>
          <button class="tbtn" data-cmd="redo">Redo</button>
          <span class="spacer"></span>
          <button class="tbtn" id="toggle-wc">Hide Word Count</button>
          <span class="wc" id="wc-box">Word Count: <b id="wc">0</b></span>
        </div>
        <div id="email-fields" class="email-fields hidden">
          <div><span>To:</span> <b id="ef-to"></b></div>
          <div><span>Subject:</span> <b id="ef-subject"></b></div>
        </div>
        <textarea class="answer" id="answer" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 결과 화면 ===================== -->
<div id="result" class="result hidden">
  <h1 id="r-title" style="font-size:22px;margin:8px 0 0">결과</h1>
  <div class="stats">
    <div class="stat"><div class="k">단어 수</div><div class="v" id="r-wc">0</div></div>
    <div class="stat"><div class="k">사용 시간</div><div class="v" id="r-time">0:00</div></div>
    <div class="stat"><div class="k">권장</div><div class="v" id="r-target" style="font-size:16px;padding-top:5px"></div></div>
  </div>
  <div class="answer-view" id="r-answer"></div>
  <div class="actions">
    <button class="btn primary" id="r-copy">답안 복사</button>
    <button class="btn" id="r-copy-all">문제+답안 복사</button>
    <button class="btn" id="r-download">.txt 다운로드</button>
    <button class="btn" id="r-retry">같은 문제 다시</button>
    <button class="btn" id="r-home">처음으로</button>
  </div>
  <details open>
    <summary>문제 보기</summary>
    <div class="prompt-view" id="r-prompt"></div>
  </details>
</div>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h3 id="m-title"></h3>
    <p id="m-text"></p>
    <div class="actions">
      <button class="btn" id="m-cancel">Return</button>
      <button class="btn primary" id="m-ok">Continue</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // 실제 시험의 단어 수 세기: 공백(스페이스/줄바꿈/탭)으로 구분된 덩어리 하나 = 1단어.
  // don't, well-known, e.g., 2026 모두 1단어. 공백 없이 붙인 "word,word"도 1단어.
  const countWords = (s) => { const t = s.trim(); return t ? t.split(/\s+/).length : 0; };

  const fmt = (sec) => {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  };
  const fmtShort = (sec) => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const show = (id) => ['setup', 'exam', 'result'].forEach(x => $(x).classList.toggle('hidden', x !== id));

  // ---------- 탭 ----------
  let curTab = 'email';
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    curTab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    $('form-email').classList.toggle('hidden', curTab !== 'email');
    $('form-discussion').classList.toggle('hidden', curTab !== 'discussion');
  });

  // ---------- 폼 ----------
  const fields = {
    email: ['e-scenario', 'e-instruction', 'e-tasks', 'e-to', 'e-subject', 'e-time'],
    discussion: ['d-course', 'd-prof', 'd-question', 'd-s1name', 'd-s1post', 'd-s2name', 'd-s2post', 'd-time'],
  };
  const readForm = (type) => {
    const v = (id) => $(id).value.trim();
    if (type === 'email') return {
      type, scenario: v('e-scenario'), instruction: v('e-instruction'),
      tasks: v('e-tasks').split('\n').map(s => s.trim()).filter(Boolean),
      to: v('e-to'), subject: v('e-subject'), minutes: parseFloat(v('e-time')) || 7,
    };
    return {
      type, course: v('d-course'), prof: v('d-prof') || 'Professor', question: v('d-question'),
      s1name: v('d-s1name') || 'Student 1', s1post: v('d-s1post'),
      s2name: v('d-s2name') || 'Student 2', s2post: v('d-s2post'),
      minutes: parseFloat(v('d-time')) || 10,
    };
  };
  const fillForm = (p) => {
    if (p.type === 'email') {
      $('e-scenario').value = p.scenario; $('e-instruction').value = p.instruction;
      $('e-tasks').value = p.tasks.join('\n'); $('e-to').value = p.to; $('e-subject').value = p.subject;
      $('e-time').value = p.minutes;
    } else {
      $('d-course').value = p.course; $('d-prof').value = p.prof; $('d-question').value = p.question;
      $('d-s1name').value = p.s1name; $('d-s1post').value = p.s1post;
      $('d-s2name').value = p.s2name; $('d-s2post').value = p.s2post; $('d-time').value = p.minutes;
    }
    document.querySelector(`.tab[data-tab="${p.type}"]`).click();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const titleOf = (p) => p.type === 'email'
    ? (p.subject || p.scenario.slice(0, 60) || '(제목 없음)')
    : (p.question.slice(0, 70) || '(질문 없음)');
  const typeLabel = (t) => t === 'email' ? 'Email' : 'Discussion';

  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    fields[b.dataset.clear].forEach(id => { if (!id.endsWith('time')) $(id).value = ''; });
  });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const p = readForm(b.dataset.save);
    const list = store.get('tw_saved', []);
    list.unshift({ ...p, id: Date.now() });
    store.set('tw_saved', list);
    renderLists();
  });
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startExam(readForm(b.dataset.start)));

  // ---------- 목록 ----------
  function renderLists() {
    const saved = store.get('tw_saved', []);
    $('saved-list').innerHTML = saved.length ? saved.map(p => `
      <li><div class="t"><span class="pill">${typeLabel(p.type)}</span>${esc(titleOf(p))}</div>
      <div class="actions" style="margin:0">
        <button class="btn primary" data-act="start" data-id="${p.id}">시작</button>
        <button class="btn" data-act="load" data-id="${p.id}">불러오기</button>
        <button class="btn danger" data-act="del" data-id="${p.id}">삭제</button>
      </div></li>`).join('') : '<li class="empty">저장한 문제가 없습니다.</li>';

    const hist = store.get('tw_history', []);
    $('history-list').innerHTML = hist.length ? hist.map(h => `
      <li><div><div class="t"><span class="pill">${typeLabel(h.problem.type)}</span>${esc(titleOf(h.problem))}</div>
      <div class="meta">${new Date(h.at).toLocaleString()} · ${h.words}단어 · ${fmtShort(h.used)}</div></div>
      <div class="actions" style="margin:0">
        <button class="btn" data-act="view" data-id="${h.at}">보기</button>
        <button class="btn danger" data-act="hdel" data-id="${h.at}">삭제</button>
      </div></li>`).join('') : '<li class="empty">아직 기록이 없습니다.</li>';
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = Number(b.dataset.id);
    const saved = store.get('tw_saved', []), hist = store.get('tw_history', []);
    const p = saved.find(x => x.id === id), h = hist.find(x => x.at === id);
    switch (b.dataset.act) {
      case 'start': startExam(p); break;
      case 'load': fillForm(p); break;
      case 'del': if (confirm('이 문제를 삭제할까요?')) { store.set('tw_saved', saved.filter(x => x.id !== id)); renderLists(); } break;
      case 'view': showResult(h); break;
      case 'hdel': if (confirm('이 기록을 삭제할까요?')) { store.set('tw_history', hist.filter(x => x.at !== id)); renderLists(); } break;
    }
  });

  // ---------- 시험 ----------
  const ans = $('answer');
  let problem = null, endAt = 0, startedAt = 0, tick = null, finished = false;
  let clip = '';
  let undoStack = [], redoStack = [], lastSnap = null;

  const AVATAR = ['#3b6fb6', '#b5523b', '#4b8a5a', '#7a4fa3'];
  const initial = (n) => (n.trim()[0] || '?').toUpperCase();
  const person = (name, text, color) => `
    <div class="person"><div class="avatar" style="background:${color}">${esc(initial(name))}</div>
    <div><div class="name">${esc(name)}</div><div class="text">${esc(text)}</div></div></div>`;

  function renderProblem(p) {
    if (p.type === 'email') {
      $('task-name').textContent = 'Write an Email';
      $('pane-left').innerHTML = `<div class="directions">
        <p><b>Directions:</b> You will read some information and use the information to write an email. You will have ${fmtMin(p.minutes)} to write the email.</p>
        <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
        <p class="scenario">${esc(p.scenario)}</p>
        ${p.instruction ? `<p>${esc(p.instruction)}</p>` : ''}
        ${p.tasks.length ? `<ul>${p.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        <p>Write as much as you can and in complete sentences.</p>
      </div>`;
      $('pane-right-top').innerHTML = '';
      $('email-fields').classList.remove('hidden');
      $('ef-to').textContent = p.to; $('ef-subject').textContent = p.subject;
    } else {
      $('task-name').textContent = 'Write for an Academic Discussion';
      $('pane-left').innerHTML = `<div class="directions">
        <p>Your professor is teaching a class on ${esc(p.course || '___')}. Write a post responding to the professor's question.</p>
        <p>In your response, you should do the following:</p>
        <ul><li>Express and support your opinion.</li><li>Make a contribution to the discussion in your own words.</li></ul>
        <p>An effective response will contain at least 100 words. You have ${fmtMin(p.minutes)} to write.</p>
        <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
        ${person(p.prof, p.question, '#20304a')}
      </div>`;
      $('pane-right-top').innerHTML = `
        <div class="post">${person(p.s1name, p.s1post, AVATAR[0])}</div>
        <div class="post">${person(p.s2name, p.s2post, AVATAR[1])}</div>
        <p class="resp-label">Your Response</p>`;
      $('email-fields').classList.add('hidden');
    }
  }
  const fmtMin = (m) => m === 1 ? '1 minute' : (Number.isInteger(m) ? `${m} minutes` : `${Math.floor(m)} minutes ${Math.round((m % 1) * 60)} seconds`);

  function startExam(p) {
    problem = p; finished = false;
    renderProblem(p);
    ans.value = ''; ans.readOnly = false;
    undoStack = []; redoStack = []; lastSnap = { v: '', s: 0, e: 0 };
    updateWC();
    show('exam');
    startedAt = Date.now();
    endAt = startedAt + p.minutes * 60000;
    clearInterval(tick);
    tick = setInterval(updateTimer, 200);
    updateTimer();
    ans.focus();
  }
  function updateTimer() {
    const left = (endAt - Date.now()) / 1000;
    $('timer').textContent = fmt(left);
    if (left <= 0 && !finished) finish(true);
  }
  function updateWC() { $('wc').textContent = countWords(ans.value); }

  $('toggle-time').onclick = () => {
    const t = $('timer'), hid = t.classList.toggle('hidden');
    $('toggle-time').textContent = hid ? 'Show Time' : 'Hide Time';
  };
  $('toggle-wc').onclick = () => {
    const hid = $('wc-box').classList.toggle('hidden');
    $('toggle-wc').textContent = hid ? 'Show Word Count' : 'Hide Word Count';
  };

  // Undo / Redo 기록 (붙여넣기/잘라내기 버튼도 되돌릴 수 있도록 직접 관리)
  const snap = () => ({ v: ans.value, s: ans.selectionStart, e: ans.selectionEnd });
  const restore = (st) => { ans.value = st.v; ans.setSelectionRange(st.s, st.e); lastSnap = st; updateWC(); };
  function pushHistory(force) {
    const cur = snap();
    if (lastSnap && cur.v === lastSnap.v) return;
    const top = undoStack[undoStack.length - 1];
    // 단어 단위로 묶어서 기록: 공백/줄바꿈이 들어왔거나 강제 저장일 때 새 단계
    const boundary = force || !top || /\s$/.test(cur.v.slice(0, cur.s)) || Math.abs(cur.v.length - lastSnap.v.length) > 1;
    if (boundary || undoStack.length === 0) undoStack.push(lastSnap);
    if (undoStack.length > 500) undoStack.shift();
    redoStack = [];
    lastSnap = cur;
  }
  ans.addEventListener('input', () => { pushHistory(false); updateWC(); });
  ans.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
    else if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); doRedo(); }
  });
  function doUndo() { if (ans.readOnly || !undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
  function doRedo() { if (ans.readOnly || !redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }

  // 실제 시험처럼 답안 칸 안에서 복사/잘라낸 텍스트만 붙여넣기 가능
  const selected = () => ans.value.slice(ans.selectionStart, ans.selectionEnd);
  function insertText(t) {
    const s = ans.selectionStart, e = ans.selectionEnd;
    ans.value = ans.value.slice(0, s) + t + ans.value.slice(e);
    ans.setSelectionRange(s + t.length, s + t.length);
    pushHistory(true); updateWC();
  }
  ans.addEventListener('copy', () => { clip = selected(); });
  ans.addEventListener('cut', (e) => {
    e.preventDefault(); if (ans.readOnly) return;
    clip = selected(); if (clip) insertText('');
  });
  ans.addEventListener('paste', (e) => { e.preventDefault(); if (!ans.readOnly && clip) insertText(clip); });
  ans.addEventListener('drop', (e) => e.preventDefault());
  document.querySelectorAll('.tbtn[data-cmd]').forEach(b => {
    b.addEventListener('mousedown', (e) => e.preventDefault()); // 커서/선택 유지
    b.onclick = () => {
      if (ans.readOnly) return;
      ans.focus();
      switch (b.dataset.cmd) {
        case 'cut': { const t = selected(); if (t) { clip = t; insertText(''); } break; }
        case 'paste': if (clip) insertText(clip); break;
        case 'undo': doUndo(); break;
        case 'redo': doRedo(); break;
      }
    };
  });

  // Next / 종료
  $('btn-next').onclick = () => {
    if (finished) return;
    modal('Are you sure you want to continue?',
      'You still have time remaining. If you continue, you will not be able to return to this question.',
      () => finish(false));
  };
  function modal(title, text, onOk) {
    $('m-title').textContent = title; $('m-text').textContent = text;
    $('modal').classList.remove('hidden');
    $('m-ok').onclick = () => { $('modal').classList.add('hidden'); onOk(); };
    $('m-cancel').onclick = () => { $('modal').classList.add('hidden'); ans.focus(); };
  }

  function finish(timeUp) {
    finished = true;
    clearInterval(tick);
    ans.readOnly = true;
    $('modal').classList.add('hidden');
    const used = Math.min((Date.now() - startedAt) / 1000, problem.minutes * 60);
    const rec = { at: Date.now(), problem, answer: ans.value, words: countWords(ans.value), used, timeUp };
    const hist = store.get('tw_history', []);
    hist.unshift(rec); store.set('tw_history', hist.slice(0, 200));
    renderLists();
    if (timeUp) {
      $('timer').textContent = '00:00:00';
      modal('Time is up', 'Your response has been saved.', () => showResult(rec));
      $('m-cancel').classList.add('hidden');
    } else showResult(rec);
  }
  $('m-cancel').classList.remove('hidden');

  // ---------- 결과 ----------
  let curRec = null;
  function promptText(p) {
    if (p.type === 'email') return [
      '[Write an Email]', p.scenario, '', p.instruction, ...p.tasks.map(t => '- ' + t),
      '', 'To: ' + p.to, 'Subject: ' + p.subject,
    ].join('\n');
    return [
      '[Academic Discussion] Class: ' + p.course, '',
      p.prof + ':', p.question, '', p.s1name + ':', p.s1post, '', p.s2name + ':', p.s2post,
    ].join('\n');
  }
  function showResult(rec) {
    curRec = rec;
    $('m-cancel').classList.remove('hidden');
    const p = rec.problem;
    $('r-title').textContent = (p.type === 'email' ? 'Write an Email' : 'Academic Discussion') + (rec.timeUp ? ' — 시간 종료' : ' — 제출');
    $('r-wc').textContent = rec.words;
    $('r-time').textContent = fmtShort(rec.used) + ' / ' + fmtShort(p.minutes * 60);
    $('r-target').textContent = p.type === 'email' ? '100–150단어 권장' : '최소 100단어 (권장 120+)';
    $('r-answer').textContent = rec.answer || '(빈 답안)';
    $('r-prompt').textContent = promptText(p);
    show('result');
    window.scrollTo(0, 0);
  }
  const copy = async (t, btn) => {
    try { await navigator.clipboard.writeText(t); }
    catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    const o = btn.textContent; btn.textContent = '복사됨!'; setTimeout(() => btn.textContent = o, 1200);
  };
  const fullText = () => promptText(curRec.problem) + '\n\n[My Answer] (' + curRec.words + ' words)\n' + curRec.answer;
  $('r-copy').onclick = (e) => copy(curRec.answer, e.target);
  $('r-copy-all').onclick = (e) => copy(fullText(), e.target);
  $('r-download').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([fullText()], { type: 'text/plain' }));
    a.download = `toefl-${curRec.problem.type}-${new Date(curRec.at).toISOString().slice(0, 16).replace(/[:T]/g, '-')}.txt`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('r-retry').onclick = () => startExam(curRec.problem);
  $('r-home').onclick = () => show('setup');

  // 시험 중 새로고침/닫기 경고
  window.addEventListener('beforeunload', (e) => { if (!$('exam').classList.contains('hidden') && !finished) { e.preventDefault(); e.returnValue = ''; } });

  renderLists();
})();
</script>
</body>
</html>
